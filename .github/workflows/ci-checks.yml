name: CI checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run lint
      - run: npm run check
      - run: npm test
